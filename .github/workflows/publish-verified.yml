name: Publish verified CarCohort source
on: workflow_dispatch
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified source and licensed Ferrari F40
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | tar xz
          mkdir -p public/models/ferrari-f40
          curl --fail --location --retry 2 https://github.com/sceneview/sceneview/releases/download/assets-v1/ferrari_f40.glb -o public/models/ferrari-f40/FerrariF40.glb
          echo 'a1ec281f1c219c049ecd07e4ef20c69d26c233b6270614743ca015a7f5713674  public/models/ferrari-f40/FerrariF40.glb' | sha256sum -c -
          git ls-files -z | python3 -c 'import sys,re,subprocess; files=[p for p in sys.stdin.buffer.read().decode().split("\0") if p and (re.search(r"(^|/)[0-9]+-",p) or p.startswith("public/models/carconcept/"))]; subprocess.run(["git","rm","-f","--"]+files,check=True) if files else None'
          git checkout 964026c -- src/assets/photos
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md package.json package-lock.json src public/models
          git commit -m 'Publish licensed Ferrari F40 scroll demo and tested site upgrades'
          git push
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
